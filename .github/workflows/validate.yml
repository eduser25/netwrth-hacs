name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands needs a home-assistant/brands PR; do that with the
          # default-store submission once the repo is public and licensed.
          ignore: brands

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
        working-directory: cards
      - run: npm run typecheck
        working-directory: cards
      - run: npm run build
        working-directory: cards
      # The committed bundle must match the source it claims to be built from.
      - run: git diff --exit-code custom_components/netwrth/frontend/netwrth-cards.js
